<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOTICIAS - INNOVATE</title>
<meta name="description" content="INNOVATE NOTICIAS: anuncios y novedades de INNOVATE INDUSTRIES." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0b0e; --bg2: #101216; --panel: #14161b; --line: #1e2128;
    --txt: #f2f3f5; --dim: #9aa0ab; --faint: #5d636e; --red: #c8102e;
  }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--txt); min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; height: 64px;
    background: #0d0e12; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand {
    font-weight: 800; letter-spacing: 4px; font-size: 1.05rem; color: #fff;
    padding: 0 28px; height: 64px; display: flex; align-items: center;
    border-right: 1px solid var(--line); text-decoration: none;
  }
  .storename {
    letter-spacing: 5px; font-size: .85rem; color: var(--dim); font-weight: 500;
    padding: 0 28px; height: 64px; display: flex; align-items: center;
  }
  .icons { margin-left: auto; display: flex; align-items: center; gap: 18px; padding: 0 26px; }
  .icons a { color: #d7dae0; text-decoration: none; font-size: 1.15rem; }
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .side {
    width: 228px; flex-shrink: 0; background: #0d0e12;
    border-right: 1px solid var(--line); padding: 18px 0;
  }
  .side a {
    display: flex; align-items: center; gap: 14px; padding: 13px 28px;
    color: var(--dim); text-decoration: none; font-size: .9rem;
  }
  .side a .ic { width: 22px; text-align: center; font-size: 1.05rem; }
  .side a.on { background: #1a1d23; color: #fff; }
  .side a:hover { color: #fff; }
  .main { flex: 1; padding: 26px 34px 60px; max-width: 1240px; }
  .pagehead { margin: 6px 0 20px; }
  .eyebrow { letter-spacing: 4px; font-size: .68rem; color: var(--faint); }
  .pagehead h1 { font-size: 2rem; font-weight: 800; letter-spacing: 2px; margin-top: 8px; }
  .feat {
    display: grid; grid-template-columns: 1.2fr 1fr; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; background: var(--panel); margin-bottom: 30px;
  }
  .feat .img { min-height: 300px; background: #171a20 center/cover; }
  .feat .body { padding: 34px; display: flex; flex-direction: column; justify-content: center; }
  .feat small, .ncard small { color: var(--faint); font-size: .72rem; letter-spacing: 2px; }
  .feat h2 { font-size: 1.5rem; margin: 10px 0; font-weight: 700; }
  .feat p { color: var(--dim); font-size: .9rem; line-height: 1.6; }
  .btn-outline {
    display: inline-block; padding: 11px 30px; border-radius: 8px; margin-top: 18px;
    border: 1px solid #8a8f99; color: #fff; text-decoration: none; font-size: .83rem;
    align-self: flex-start;
  }
  .btn-outline:hover { border-color: #fff; }
  .sechead { display: flex; align-items: baseline; margin: 30px 0 16px; }
  .sechead h2 { font-size: 1.25rem; font-weight: 500; letter-spacing: 1px; }
  .news { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .ncard { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .ncard .img { aspect-ratio: 16/8; background: #171a20 center/cover; }
  .ncard .body { padding: 16px; }
  .ncard h3 { font-size: .9rem; margin: 8px 0; font-weight: 600; }
  .ncard p { color: var(--dim); font-size: .82rem; line-height: 1.5; }
  .empty {
    border: 1px dashed #2c313a; border-radius: 8px; padding: 30px; text-align: center;
    color: var(--faint); font-size: .85rem; grid-column: 1 / -1;
  }
  footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: .75rem; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--dim); text-decoration: none; }
  @media (max-width: 1020px) { .news { grid-template-columns: 1fr 1fr; } .feat { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .side { width: 100%; display: flex; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
    .side a { padding: 12px 18px; white-space: nowrap; }
    .main { padding: 20px 16px 50px; }
    .news { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">INNOVATE</a>
    <span class="storename">NOTICIAS</span>
    <div class="icons">
      <a href="http://localhost:5215/Account/Login" title="Cuenta">&#128100;</a>
    </div>
  </header>

  <div class="layout">
    <nav class="side">
      <a href="index.html"><span class="ic">&#8962;</span>Inicio</a>
      <a href="store.html"><span class="ic">&#127918;</span>Juegos</a>
      <a href="store.html#dlc"><span class="ic">&#128230;</span>DLC</a>
      <a href="store.html#ofertas"><span class="ic">&#127991;</span>Ofertas</a>
      <a href="store.html#biblio"><span class="ic">&#128214;</span>Mi biblioteca</a>
    </nav>

    <main class="main">
      <div class="pagehead">
        <div class="eyebrow">ANUNCIOS OFICIALES</div>
        <h1>NOTICIAS</h1>
      </div>

      <div class="feat" id="feat" style="display:none">
        <div class="img" id="feat-img"></div>
        <div class="body">
          <small id="feat-date"></small>
          <h2 id="feat-title"></h2>
          <p id="feat-body"></p>
          <a class="btn-outline" id="feat-link" href="#" target="_blank" rel="noopener" style="display:none">Abrir enlace</a>
        </div>
      </div>

      <div class="sechead"><h2>Todas las noticias</h2></div>
      <div class="news" id="news"></div>

      <footer>
        <span>&copy; 2026 INNOVATE · INNOVATE INDUSTRIES</span>
        <a href="index.html">Inicio</a><a href="store.html">Tienda</a><a href="plataforma.html">Plataforma</a><a href="showcase.html">Showcase</a><a href="admin.html">Admin</a>
      </footer>
    </main>
  </div>

<script>
(function () {
  function fix(p) {
    if (!p) return "";
    if (/^https?:\/\//i.test(p)) return p;
    return p.charAt(0) === "/" ? "." + p : p;
  }
  function empty(msg) {
    var d = document.createElement("div");
    d.className = "empty"; d.textContent = msg;
    return d;
  }
  fetch("./news.json").then(function (r) { return r.json(); }).then(function (d) {
    var list = (d && d.news) || [];
    var box = document.getElementById("news");
    if (!list.length) { box.appendChild(empty("Sin noticias por ahora.")); return; }
    var f = list[0];
    document.getElementById("feat").style.display = "";
    if (f.imagePath) document.getElementById("feat-img").style.backgroundImage = "url('" + fix(f.imagePath) + "')";
    document.getElementById("feat-date").textContent = (f.createdAtUtc || "").slice(0, 10);
    document.getElementById("feat-title").textContent = f.title || "";
    document.getElementById("feat-body").textContent = (f.body || "").slice(0, 220);
    if (f.linkUrl) {
      var a = document.getElementById("feat-link");
      a.style.display = "";
      a.href = f.linkUrl;
      if (f.linkText) a.textContent = f.linkText;
    }
    list.slice(1).forEach(function (n) {
      var c = document.createElement("div"); c.className = "ncard";
      var img = document.createElement("div"); img.className = "img";
      if (n.imagePath) img.style.backgroundImage = "url('" + fix(n.imagePath) + "')";
      var b = document.createElement("div"); b.className = "body";
      var s = document.createElement("small"); s.textContent = (n.createdAtUtc || "").slice(0, 10);
      var h = document.createElement("h3"); h.textContent = n.title || "";
      var p = document.createElement("p"); p.textContent = (n.body || "").slice(0, 120);
      b.appendChild(s); b.appendChild(h); b.appendChild(p);
      if (n.linkUrl) {
        var l = document.createElement("p");
        var la = document.createElement("a");
        la.href = n.linkUrl; la.target = "_blank"; la.rel = "noopener";
        la.textContent = n.linkText || "Abrir enlace";
        la.style.color = "#fff";
        l.appendChild(la); b.appendChild(l);
      }
      c.appendChild(img); c.appendChild(b);
      box.appendChild(c);
    });
  }).catch(function () {
    document.getElementById("news").appendChild(empty("Sin noticias por ahora."));
  });
})();
</script>
</body>
</html>
