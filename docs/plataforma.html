<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PLATAFORMA - NEXUS</title>
<meta name="description" content="NEXUS PLATAFORMA: descarga oficial del INNOVATE LAUNCHER." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0b0e; --bg2: #101216; --panel: #14161b; --line: #1e2128;
    --txt: #f2f3f5; --dim: #9aa0ab; --faint: #5d636e; --red: #c8102e;
  }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--txt); min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; height: 64px;
    background: #0d0e12; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .brand {
    font-weight: 800; letter-spacing: 4px; font-size: 1.05rem; color: #fff;
    padding: 0 28px; height: 64px; display: flex; align-items: center;
    border-right: 1px solid var(--line); text-decoration: none;
  }
  .storename {
    letter-spacing: 5px; font-size: .85rem; color: var(--dim); font-weight: 500;
    padding: 0 28px; height: 64px; display: flex; align-items: center;
  }
  .icons { margin-left: auto; display: flex; align-items: center; gap: 18px; padding: 0 26px; }
  .icons a { color: #d7dae0; text-decoration: none; font-size: 1.15rem; }
  .layout { display: flex; min-height: calc(100vh - 64px); }
  .side {
    width: 228px; flex-shrink: 0; background: #0d0e12;
    border-right: 1px solid var(--line); padding: 18px 0;
  }
  .side a {
    display: flex; align-items: center; gap: 14px; padding: 13px 28px;
    color: var(--dim); text-decoration: none; font-size: .9rem;
  }
  .side a .ic { width: 22px; text-align: center; font-size: 1.05rem; }
  .side a.on { background: #1a1d23; color: #fff; }
  .side a:hover { color: #fff; }
  .main { flex: 1; padding: 26px 34px 60px; max-width: 1240px; }
  .pagehead { margin: 6px 0 20px; }
  .eyebrow { letter-spacing: 4px; font-size: .68rem; color: var(--faint); }
  .pagehead h1 { font-size: 2rem; font-weight: 800; letter-spacing: 2px; margin-top: 8px; }
  .dl {
    display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; background: var(--panel); margin-bottom: 30px;
  }
  .dl .body { padding: 38px; display: flex; flex-direction: column; justify-content: center; }
  .ver {
    display: inline-block; font-size: .75rem; letter-spacing: 2px; color: #0a0b0e;
    background: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 700;
    align-self: flex-start;
  }
  .ver.mand { background: var(--red); color: #fff; }
  .dl h2 { font-size: 1.8rem; margin: 14px 0 6px; letter-spacing: 1px; }
  .dl .meta { color: var(--faint); font-size: .8rem; }
  .dl p.desc { color: var(--dim); font-size: .9rem; line-height: 1.6; margin: 14px 0 22px; white-space: pre-wrap; }
  .btn-solid {
    display: inline-block; padding: 14px 40px; border-radius: 8px; align-self: flex-start;
    background: #fff; color: #0a0b0e; text-decoration: none; font-weight: 700; font-size: .9rem;
  }
  .btn-solid:hover { background: #e8eaee; }
  .dl .shot { min-height: 320px; background: #171a20 center/cover; }
  .sechead { display: flex; align-items: baseline; margin: 30px 0 16px; }
  .sechead h2 { font-size: 1.25rem; font-weight: 500; letter-spacing: 1px; }
  .specs { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 22px; }
  .specs li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--dim); font-size: .87rem; }
  .specs li:last-child { border-bottom: 0; }
  .specs li::before { content: "— "; color: var(--faint); }
  .notes {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    padding: 20px 22px; color: var(--dim); font-size: .87rem; line-height: 1.6; white-space: pre-wrap;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .82rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: #00f0ff; letter-spacing: 1px; font-size: .72rem; }
  td.num, th.num { text-align: right; font-family: Consolas, monospace; }
  td a { color: #fff; }
  .empty {
    border: 1px dashed #2c313a; border-radius: 8px; padding: 34px; text-align: center;
    color: var(--faint); font-size: .87rem;
  }
  footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--faint); font-size: .75rem; display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--dim); text-decoration: none; }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .side { width: 100%; display: flex; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
    .side a { padding: 12px 18px; white-space: nowrap; }
    .main { padding: 20px 16px 50px; }
    .dl { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">NEXUS</a>
    <span class="storename">PLATAFORMA</span>
    <div class="icons">
      <a href="http://localhost:5215/Account/Login" title="Cuenta">&#128100;</a>
    </div>
  </header>

  <div class="layout">
    <nav class="side">
      <a href="index.html"><span class="ic">&#8962;</span>Inicio</a>
      <a href="store.html"><span class="ic">&#127918;</span>Juegos</a>
      <a href="store.html#dlc"><span class="ic">&#128230;</span>DLC</a>
      <a href="store.html#ofertas"><span class="ic">&#127991;</span>Ofertas</a>
      <a href="store.html#biblio"><span class="ic">&#128214;</span>Mi biblioteca</a>
    </nav>

    <main class="main">
      <div class="pagehead">
        <div class="eyebrow">DESCARGA OFICIAL</div>
        <h1>PLATAFORMA</h1>
      </div>

      <div id="wrap"></div>

      <footer>
        <span>&copy; 2026 NEXUS · INNOVATE INDUSTRIES</span>
        <a href="index.html">Inicio</a><a href="store.html">Tienda</a><a href="noticias.html">Noticias</a><a href="showcase.html">Showcase</a><a href="admin.html">Admin</a>
      </footer>
    </main>
  </div>

<script>
(function () {
  function fix(p) {
    if (!p) return "";
    if (/^https?:\/\//i.test(p)) return p;
    return p.charAt(0) === "/" ? "." + p : p;
  }
  function size(b) {
    b = Number(b || 0);
    return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  fetch("./builds.json").then(function (r) { return r.json(); }).then(function (d) {
    var list = (d && d.builds) || [];
    var wrap = document.getElementById("wrap");
    if (!list.length) {
      var e = el("div", "empty", "A\u00fan no hay builds publicados.");
      wrap.appendChild(e);
      return;
    }
    var b = list[0];
    var dl = el("div", "dl");
    var body = el("div", "body");
    var ver = el("span", "ver" + (b.isMandatory ? " mand" : ""), (b.version || "?") + (b.isMandatory ? " · OBLIGATORIA" : ""));
    var h = el("h2", null, "INNOVATE LAUNCHER");
    var meta = el("div", "meta", (b.fileName || "") + " · " + size(b.sizeBytes) + " · " + (b.downloads || 0) + " descargas");
    body.appendChild(ver); body.appendChild(h); body.appendChild(meta);
    if (b.description) {
      var desc = el("p", "desc", b.description);
      body.appendChild(desc);
    }
    var a = el("a", "btn-solid", "DESCARGAR");
    a.href = fix(b.filePath);
    body.appendChild(a);
    dl.appendChild(body);
    var shot = el("div", "shot");
    if (b.screenshotPath) shot.style.backgroundImage = "url('" + fix(b.screenshotPath) + "')";
    dl.appendChild(shot);
    wrap.appendChild(dl);

    if (b.specs) {
      var sh = el("div", "sechead"); sh.appendChild(el("h2", null, "Ficha t\u00e9cnica"));
      wrap.appendChild(sh);
      var ul = el("ul", "specs");
      b.specs.split("\n").forEach(function (s) {
        s = s.trim();
        if (s) ul.appendChild(el("li", null, s));
      });
      wrap.appendChild(ul);
    }
    if (b.notes) {
      var nh = el("div", "sechead"); nh.appendChild(el("h2", null, "Notas de la versi\u00f3n"));
      wrap.appendChild(nh);
      wrap.appendChild(el("div", "notes", b.notes));
    }
    if (list.length > 1) {
      var vh = el("div", "sechead"); vh.appendChild(el("h2", null, "Versiones anteriores"));
      wrap.appendChild(vh);
      var t = document.createElement("table");
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      ["VERSI\u00d3N", "ARCHIVO", "TAMA\u00d1O", "DESCARGAS", ""].forEach(function (x, i) {
        var th = el("th", i >= 2 ? "num" : null, x);
        hr.appendChild(th);
      });
      thead.appendChild(hr); t.appendChild(thead);
      var tb = document.createElement("tbody");
      list.slice(1).forEach(function (o) {
        var tr = document.createElement("tr");
        tr.appendChild(el("td", null, o.version));
        tr.appendChild(el("td", null, o.fileName));
        var s = el("td", "num", size(o.sizeBytes)); tr.appendChild(s);
        var dl2 = el("td", "num", String(o.downloads || 0)); tr.appendChild(dl2);
        var act = document.createElement("td");
        var la = document.createElement("a"); la.href = fix(o.filePath); la.textContent = "Descargar";
        act.appendChild(la); tr.appendChild(act);
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      wrap.appendChild(t);
    }
  }).catch(function () {
    document.getElementById("wrap").appendChild(el("div", "empty", "No se pudo cargar la informaci\u00f3n."));
  });
})();
</script>
</body>
</html>
